name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Pinned, not ubuntu-latest: a new image changes the preinstalled system libraries without notice,
# so a red run would no longer mean that this repo's change broke something.
jobs:
  test:
    name: Pipeline tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # 3.10 matches the local WSL venv the pipeline is developed in
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      # PySpark starts a JVM; Spark 3.5 supports Java 8, 11 and 17
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test
        run: pytest -v
      - name: Run the pipeline and both reconciliations
        run: |
          python src/ingest.py
          python src/refine.py
          python src/curate.py
          python src/reconcile.py
          python src/reconcile.py --plant-break
      # The committed reports are evidence only if a fresh run reproduces them byte for byte
      - name: Reports match the committed ones
        run: git diff --exit-code results/
